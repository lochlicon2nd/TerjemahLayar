      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rakit APK
        working-directory: TerjemahLayar
        run: gradle assembleDebug --no-daemon

      - name: Beri nama file
        run: cp TerjemahLayar/app/build/outputs/apk/debug/app-debug.apk TerjemahLayar.apk

      - name: Terbitkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Terjemah Layar (versi ${{ github.run_number }})
          body: Ketuk TerjemahLayar.apk di bawah untuk mengunduh, lalu pasang di HP.
          files: TerjemahLayar.apk
